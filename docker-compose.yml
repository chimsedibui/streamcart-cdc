# Marketplace source system (vendored from the Simulated project by scripts/sync-source.sh) feeding this
# project's own pipeline: Debezium -> Kafka -> Spark micro-batches -> Iceberg on SeaweedFS (S3).
name: streamcart

include:
  - source/compose.yml   # postgres, identity, source-api, simulator, adminer

services:

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      CLUSTER_ID: 2qSwnJXZRt-pVWxfonRqtQ
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: cdc-debezium
    hostname: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 8083:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium-config
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      # Connector configs read secrets as ${dir:/run/secrets:<file>}, so the password is never in the stored config
      CONNECT_CONFIG_PROVIDERS: dir
      CONNECT_CONFIG_PROVIDERS_DIR_CLASS: org.apache.kafka.common.config.provider.DirectoryConfigProvider
    volumes:
      - ./secrets/cdc_db_password:/run/secrets/cdc_db_password:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdc-kafka-ui
    hostname: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083
      DYNAMIC_CONFIG_ENABLED: true


  dashboard:
    build: ./dashboard
    container_name: cdc-dashboard
    ports:
      - 8501:8501
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # S3-compatible object store for the Iceberg warehouse (MinIO no longer publishes images); stands in for S3
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: cdc-seaweedfs
    hostname: seaweedfs
    entrypoint: ["/bin/sh", "/seaweedfs-start.sh"]
    ports:
      - 8333:8333   # S3 API
    environment:
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin123
    volumes:
      - ./lakehouse/seaweedfs-start.sh:/seaweedfs-start.sh:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.bucket-ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Iceberg catalog (Apache Polaris): namespaces, tables and per-engine principals and roles, kept in polaris-db
  polaris-db:
    image: postgres:15
    container_name: cdc-polaris-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD_FILE: /run/secrets/polaris_db_password
      POSTGRES_DB: polaris
    volumes:
      - ./secrets/polaris_db_password:/run/secrets/polaris_db_password:ro
      - ./lakehouse/polaris/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - polaris_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the realm and its root principal (secrets/polaris_root_secret); a second run finds them
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    container_name: cdc-polaris-bootstrap
    environment: &polaris-db-env
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_JDBC_ADDITIONAL_JDBC_PROPERTIES_CURRENTSCHEMA: polaris
    entrypoint: ["/bin/bash", "-c", "export QUARKUS_DATASOURCE_PASSWORD=$$(cat /run/secrets/polaris_db_password); /opt/jboss/container/java/run/run-java.sh bootstrap -r POLARIS -c POLARIS,root,$$(cat /run/secrets/polaris_root_secret) | tee /tmp/out; grep -q -E 'Bootstrap completed successfully|already bootstrapped' /tmp/out"]
    volumes:
      - ./secrets/polaris_db_password:/run/secrets/polaris_db_password:ro
      - ./secrets/polaris_root_secret:/run/secrets/polaris_root_secret:ro
    depends_on:
      polaris-db:
        condition: service_healthy

  polaris:
    image: apache/polaris:1.8.0
    container_name: cdc-polaris
    hostname: polaris
    restart: unless-stopped
    ports:
      - 8181:8181   # Iceberg REST at /api/catalog, management API at /api/management/v1
    environment:
      <<: *polaris-db-env
      QUARKUS_CONFIG_LOCATIONS: /etc/polaris/application.properties
      # Polaris writes table metadata itself; SeaweedFS keys, as the catalog vends none (application.properties)
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      AWS_REGION: us-east-1
    entrypoint: ["/bin/bash", "-c", "export QUARKUS_DATASOURCE_PASSWORD=$$(cat /run/secrets/polaris_db_password); exec /opt/jboss/container/java/run/run-java.sh"]
    volumes:
      - ./lakehouse/polaris/application.properties:/etc/polaris/application.properties:ro
      - ./secrets/polaris_db_password:/run/secrets/polaris_db_password:ro
    healthcheck:
      # no curl in the image: plain HTTP over bash's /dev/tcp to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8182 && printf 'GET /q/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  # One-shot: the lakehouse catalog, its roles, and the spark / flink / analyst principals (lakehouse/polaris/init.py)
  polaris-init:
    image: python:3.11-slim
    container_name: cdc-polaris-init
    command: ["python", "/init.py"]
    volumes:
      - ./lakehouse/polaris/init.py:/init.py:ro
      - ./secrets/polaris_root_secret:/run/secrets/polaris_root_secret:ro
      - ./secrets/polaris:/secrets/polaris
    depends_on:
      polaris:
        condition: service_healthy

  spark-landing:
    image: apache/spark:3.5.1
    container_name: cdc-spark-landing
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ICEBERG_REST_URI: http://polaris:8181/api/catalog
      ICEBERG_WAREHOUSE: lakehouse
      ICEBERG_CREDENTIAL_FILE: /run/secrets/polaris/spark
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./spark_microbatch:/opt/spark/jobs:ro
      - ./secrets/polaris/spark:/run/secrets/polaris/spark:ro
      - spark_checkpoints:/opt/spark/work-dir
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.1,org.apache.iceberg:iceberg-aws-bundle:1.9.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - /opt/spark/jobs/landing_cdc_stream.py
    depends_on:
      kafka:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      polaris-init:
        condition: service_completed_successfully

  # Flink session cluster: streaming CDC upserts into lakehouse.silver.* (job: flink/sql/silver.sql)
  flink-jobmanager:
    build: ./flink
    image: streamcart/flink:1.20-iceberg
    container_name: cdc-flink-jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - 8082:8081   # Flink UI
    environment: &flink-env
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      AWS_REGION: us-east-1
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 3072m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        state.backend.type: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        restart-strategy.type: exponential-delay
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - ./secrets/polaris/flink:/run/secrets/polaris/flink:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      kafka:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      polaris-init:
        condition: service_completed_successfully

  flink-taskmanager:
    image: streamcart/flink:1.20-iceberg
    container_name: cdc-flink-taskmanager
    hostname: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment: *flink-env
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - ./secrets/polaris/flink:/run/secrets/polaris/flink:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  # One-shot: submits the silver job when it is not already running
  flink-silver:
    image: streamcart/flink:1.20-iceberg
    container_name: cdc-flink-silver
    command: /opt/flink/submit.sh
    environment: *flink-env
    volumes:
      - ./secrets/polaris/flink:/run/secrets/polaris/flink:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started

  # ---------------------------------------------------------------- platform (profiles, see .env.example)
  # Metadata for the platform services: one database each for Dagster, Marquez and Superset, plus ops.* (check
  # results and publishes, read by Grafana). platform/db/init.sh runs on the first start.
  platform-db:
    image: postgres:15
    container_name: cdc-platform-db
    profiles: [platform, bi, lineage]
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD_FILE: /run/secrets/platform_db_password
      POSTGRES_DB: platform
    volumes:
      - ./secrets/platform_db_password:/run/secrets/platform_db_password:ro
      - ./secrets/ops_reader_password:/run/secrets/ops_reader_password:ro
      - ./platform/db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - platform_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SQL over the lakehouse: catalog `lakehouse` reads as Polaris principal analyst, `lakehouse_rw` (Trino user dagster
  # only, lakehouse/trino/rules.json) writes as dagster; `memory` holds test fixtures. Heap: 80% of mem_limit.
  trino:
    image: trinodb/trino:484
    container_name: cdc-trino
    hostname: trino
    profiles: [platform, bi]
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - 8090:8080   # Trino UI and client protocol (8080 is Kafka UI)
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
    entrypoint: ["/bin/bash", "-c", "export POLARIS_ANALYST=$$(cat /run/secrets/polaris/analyst) POLARIS_DAGSTER=$$(cat /run/secrets/polaris/dagster); exec /usr/lib/trino/bin/launcher run --etc-dir /etc/trino"]
    volumes:
      - ./lakehouse/trino/config.properties:/etc/trino/config.properties:ro
      - ./lakehouse/trino/rules.json:/etc/trino/rules.json:ro
      - ./lakehouse/trino/catalog:/etc/trino/catalog:ro
      - ./secrets/polaris/analyst:/run/secrets/polaris/analyst:ro
      - ./secrets/polaris/dagster:/run/secrets/polaris/dagster:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      polaris-init:
        condition: service_completed_successfully

  # Dagster: the platform's control plane (assets, checks, schedules, runs) at http://localhost:3070. The webserver
  # serves the UI; the daemon runs schedules, sensors and the run queue. Code and specs are mounted, not baked in.
  dagster-webserver:
    build:
      context: ./orchestration
      additional_contexts:
        platform: ./platform
    image: streamcart/dagster:1.13
    container_name: cdc-dagster-webserver
    hostname: dagster-webserver
    profiles: [platform]
    restart: unless-stopped
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3070", "-w", "/opt/dagster/home/workspace.yaml"]
    ports:
      - 3070:3070
    environment: &dagster-env
      TRINO_URL: http://trino:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
    volumes: &dagster-volumes
      - ./platform:/opt/streamcart/platform:ro
      - ./pipelines:/opt/streamcart/pipelines:ro
      - ./orchestration/streamcart_dagster:/opt/streamcart/orchestration/streamcart_dagster:ro
      - ./secrets/platform_db_password:/run/secrets/platform_db_password:ro
      - ./secrets/app_reader_password:/run/secrets/app_reader_password:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3070/server_info')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on: &dagster-deps
      platform-db:
        condition: service_healthy
      trino:
        condition: service_healthy

  dagster-daemon:
    image: streamcart/dagster:1.13
    container_name: cdc-dagster-daemon
    profiles: [platform]
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    environment: *dagster-env
    volumes: *dagster-volumes
    depends_on:
      <<: *dagster-deps
      dagster-webserver:
        condition: service_healthy

  # ---------------------------------------------------------------- monitoring (profile monitoring)
  # Replication slot state and lag, as the read-only role monitor_reader (observability/setup-postgres.sql)
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: cdc-postgres-exporter
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/enterprise_db?sslmode=disable
      DATA_SOURCE_USER: monitor_reader
      DATA_SOURCE_PASS_FILE: /run/secrets/monitor_password
    volumes:
      - ./secrets/monitor_password:/run/secrets/monitor_password:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Topic offsets and consumer group lag (flink-silver)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: cdc-kafka-exporter
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: cdc-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - 9090:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Dashboards and alert rules (observability/grafana/), at http://localhost:3000 (admin / secrets/grafana_admin_password)
  grafana:
    image: grafana/grafana:12.0.0
    container_name: cdc-grafana
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./secrets/ops_reader_password:/run/secrets/ops_reader_password:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------- lineage (profile lineage)
  # OpenLineage backend: Dagster sends gold runs and the streaming graph (platform/streamcart/lineage.py)
  marquez:
    image: marquezproject/marquez:0.50.0
    container_name: cdc-marquez
    hostname: marquez
    profiles: [lineage]
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - 5000:5000   # API (/api/v1/lineage, /api/v1/namespaces)
    environment:
      MARQUEZ_CONFIG: /etc/marquez/marquez.yml
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    entrypoint: ["/bin/bash", "-c", "export POSTGRES_PASSWORD=$$(cat /run/secrets/platform_db_password); exec /usr/src/app/entrypoint.sh"]
    volumes:
      - ./lineage/marquez.yml:/etc/marquez/marquez.yml:ro
      - ./secrets/platform_db_password:/run/secrets/platform_db_password:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      platform-db:
        condition: service_healthy

  # Lineage graph UI at http://localhost:3002
  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    container_name: cdc-marquez-web
    profiles: [lineage]
    restart: unless-stopped
    ports:
      - 3002:3002
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3002
      REACT_APP_ADVANCED_SEARCH: "false"
    depends_on:
      marquez:
        condition: service_healthy

  # ---------------------------------------------------------------- BI (profile bi)
  # Superset over Trino's read-only catalog, at http://localhost:8088 (admin / secrets/superset_admin_password).
  # bi/bootstrap.py creates the Lakehouse database, the gold datasets and the Marketplace KPIs dashboard.
  superset:
    build: ./bi
    image: streamcart/superset:4.1.2
    container_name: cdc-superset
    profiles: [bi]
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - 8088:8088
    environment:
      SERVER_WORKER_AMOUNT: 2
    volumes:
      - ./secrets/superset_secret_key:/run/secrets/superset_secret_key:ro
      - ./secrets/superset_admin_password:/run/secrets/superset_admin_password:ro
      - ./secrets/platform_db_password:/run/secrets/platform_db_password:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      platform-db:
        condition: service_healthy
      trino:
        condition: service_healthy

volumes:
  kafka_data:
  seaweedfs_data:
  spark_checkpoints:
  flink_checkpoints:
  polaris_db:
  platform_db:
  prometheus_data:
  grafana_data:
