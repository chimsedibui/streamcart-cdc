# Polaris catalog for the lakehouse: state in its own PostgreSQL (polaris-db), one realm, S3 on SeaweedFS.
polaris.persistence.type=relational-jdbc
quarkus.datasource.jdbc.url=jdbc:postgresql://polaris-db:5432/polaris
quarkus.datasource.username=polaris
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=polaris
# password: QUARKUS_DATASOURCE_PASSWORD, exported from secrets/polaris_db_password by the entrypoint

polaris.realm-context.realms=POLARIS

polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["S3"]
# SeaweedFS stands in for S3: the catalog names its endpoint (path-style), and as it has no STS
# (stsUnavailable in the catalog's storage config, lakehouse/polaris/init.py) engines use their own S3 keys
polaris.features."ALLOW_SETTING_S3_ENDPOINTS"=true
