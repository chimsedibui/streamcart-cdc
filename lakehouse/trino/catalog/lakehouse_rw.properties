# The lakehouse for the platform (Dagster): Polaris principal `dagster` (writer). Gold builds, audit branches,
# quarantine tables and table maintenance run here; lakehouse/trino/rules.json keeps every other Trino user out.
connector.name=iceberg
iceberg.security=file
security.config-file=/etc/trino/rules.json
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_DAGSTER}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
# SeaweedFS has no STS, so Polaris vends no credentials: Trino uses its own S3 keys
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
# maintenance: Flink commits every 30 s, so a day of snapshots is thousands; keep an hour, not the default week
iceberg.expire-snapshots.min-retention=1h
iceberg.remove-orphan-files.min-retention=1h
