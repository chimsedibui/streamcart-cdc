# Columns, key and replica identity mirror the source (platform/cli.py validate checks them);
# owner, description, expectations and freshness are ours to edit.
dataset: silver.flash_sale_items
owner: growth-data
description: Current state of ecommerce.flash_sale_items, one row per primary key.
mode: streaming
from: kafka:cdc.ecommerce.flash_sale_items
primary_key: [id]
replica_identity: full
columns:
  id: uuid
  campaign_id: uuid
  sku_id: uuid
  sale_price: bigint
  quota: integer
  sold: integer
  created_at: timestamp with time zone
  updated_at: timestamp with time zone
freshness: {warn_after: 15m, error_after: 1h}
