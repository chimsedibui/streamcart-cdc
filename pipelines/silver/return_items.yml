# Columns, key and replica identity mirror the source (platform/cli.py validate checks them);
# owner, description, expectations and freshness are ours to edit.
dataset: silver.return_items
owner: logistics-data
description: Current state of ecommerce.return_items, one row per primary key.
mode: streaming
from: kafka:cdc.ecommerce.return_items
primary_key: [id]
replica_identity: full
columns:
  id: uuid
  return_id: uuid
  order_item_id: uuid
  quantity: integer
  refund_amount: bigint
  condition: character varying
  created_at: timestamp with time zone
  updated_at: timestamp with time zone
freshness: {warn_after: 15m, error_after: 1h}
