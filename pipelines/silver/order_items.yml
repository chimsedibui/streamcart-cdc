# Columns, key and replica identity mirror the source (platform/cli.py validate checks them);
# owner, description, expectations and freshness are ours to edit.
dataset: silver.order_items
owner: commerce-data
description: "Order lines: SKU, quantity, prices at checkout and the line's share of vouchers."
mode: streaming
from: kafka:cdc.ecommerce.order_items
primary_key: [id]
replica_identity: full
columns:
  id: uuid
  order_id: uuid
  sku_id: uuid
  product_id: uuid
  quantity: integer
  list_price: bigint
  unit_price: bigint
  line_total: bigint
  shop_discount: bigint
  platform_discount: bigint
  net_amount: bigint
  campaign_item_id: uuid
  created_at: timestamp with time zone
  updated_at: timestamp with time zone
expectations:
  - name: line_total_is_quantity_times_price
    sql: line_total = quantity * unit_price
    on_fail: quarantine
  - name: net_amount_matches_discounts
    sql: net_amount = line_total - shop_discount - platform_discount AND net_amount >= 0
    on_fail: quarantine
freshness: {warn_after: 5m, error_after: 15m}
