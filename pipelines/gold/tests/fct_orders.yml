dataset: gold.fct_orders
cases:
  - name: an order gets its shop and the business date it was placed on (Vietnam time)
    given:
      silver.shops:
        - {id: s1, name: Shop A, shop_tier: MALL}
      silver.orders:
        - {id: o1, order_number: N1, shop_id: s1, customer_id: c1, status: COMPLETED, payment_method: MOMO,
           subtotal: 100000, shop_discount: 5000, platform_discount: 0, shipping_fee: 20000, shipping_subsidy: 10000,
           total: 105000, created_at: "2026-10-01 18:30:00 UTC"}
    expect:
      rows:
        - {order_id: o1, shop_name: Shop A, shop_tier: MALL, order_date: "2026-10-02", is_cancelled: false}

  - name: a total that does not add up blocks the publish
    given:
      silver.shops:
        - {id: s1, name: Shop A, shop_tier: MALL}
      silver.orders:
        - {id: o1, shop_id: s1, status: COMPLETED, subtotal: 100000, shop_discount: 0, platform_discount: 0,
           shipping_fee: 20000, shipping_subsidy: 0, total: 120000, created_at: "2026-10-01 10:00:00 UTC"}
        - {id: o2, shop_id: s1, status: COMPLETED, subtotal: 100000, shop_discount: 0, platform_discount: 0,
           shipping_fee: 20000, shipping_subsidy: 0, total: 99000, created_at: "2026-10-01 10:00:00 UTC"}
    expect:
      failing: {total_matches_parts: 1}

  - name: an unknown status and an order whose shop has not arrived yet are flagged
    given:
      silver.shops: []
      silver.orders:
        - {id: o1, shop_id: s9, status: LOST, subtotal: 1, shop_discount: 0, platform_discount: 0, shipping_fee: 0,
           shipping_subsidy: 0, total: 1, created_at: "2026-10-01 10:00:00 UTC"}
    expect:
      failing: {known_status: 1, shop_known: 1}
      rows:
        - {order_id: o1, shop_name: null, is_cancelled: false}
