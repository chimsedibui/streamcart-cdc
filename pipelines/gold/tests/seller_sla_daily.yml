dataset: gold.seller_sla_daily
cases:
  - name: every SLA outcome is counted once, and COD orders start the clock when they are placed
    given:
      gold.fct_orders:
        # online, packed after 10 hours: on time
        - {order_id: o1, shop_id: s1, shop_name: A, created_at: "2026-10-01 00:00:00 UTC",
           paid_at: "2026-10-01 02:00:00 UTC", confirm_by: "2026-10-03 02:00:00 UTC",
           ready_at: "2026-10-01 12:00:00 UTC"}
        # COD (no paid_at), packed 50 hours after it was placed: late
        - {order_id: o2, shop_id: s1, shop_name: A, created_at: "2026-10-01 01:00:00 UTC",
           confirm_by: "2026-10-03 01:00:00 UTC", ready_at: "2026-10-03 03:00:00 UTC"}
        # cancelled by the source for the breach
        - {order_id: o3, shop_id: s1, shop_name: A, created_at: "2026-10-01 00:00:00 UTC",
           paid_at: "2026-10-01 01:00:00 UTC", confirm_by: "2026-10-03 01:00:00 UTC",
           cancelled_at: "2026-10-03 01:05:00 UTC", cancel_reason: seller_sla_breach}
        # cancelled by the buyer before packing: not the seller's fault
        - {order_id: o4, shop_id: s1, shop_name: A, created_at: "2026-10-01 00:00:00 UTC",
           paid_at: "2026-10-01 01:00:00 UTC", confirm_by: "2026-10-03 01:00:00 UTC",
           cancelled_at: "2026-10-01 05:00:00 UTC", cancel_reason: changed_mind}
        # still waiting
        - {order_id: o5, shop_id: s1, shop_name: A, created_at: "2026-10-01 00:00:00 UTC",
           paid_at: "2026-10-01 01:00:00 UTC", confirm_by: "2026-10-03 01:00:00 UTC"}
        # unpaid online order: no SLA yet
        - {order_id: o6, shop_id: s1, shop_name: A, created_at: "2026-10-01 00:00:00 UTC"}
    expect:
      rows:
        - {shop_id: s1, sla_date: "2026-10-01", orders_due: 5, packed_on_time: 1, packed_late: 1, sla_cancelled: 1,
           other_cancelled: 1, pending: 1, avg_hours_to_pack: 30.0}
